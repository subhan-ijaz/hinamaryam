<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">AML Watcher concept illustration</title>
  <desc id="desc">Illustrative compliance dashboard with screening status cards and risk chart.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#242035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#background)"/>
  <rect x="44" y="40" width="1112" height="520" rx="24" fill="#111827" stroke="#ffffff" stroke-opacity=".16"/>
  <rect x="44" y="40" width="210" height="520" rx="24" fill="#0b1220"/>
  <text x="74" y="91" fill="#fbbf24" font-family="Arial,sans-serif" font-size="24" font-weight="700">AML WATCHER</text>
  <rect x="72" y="125" width="150" height="38" rx="10" fill="#f59e0b" fill-opacity=".16"/>
  <text x="92" y="151" fill="#fcd34d" font-family="Arial,sans-serif" font-size="16">Overview</text>
  <text x="90" y="202" fill="#9ca3af" font-family="Arial,sans-serif" font-size="15">Screening</text>
  <text x="90" y="246" fill="#9ca3af" font-family="Arial,sans-serif" font-size="15">Risk assessments</text>
  <text x="90" y="290" fill="#9ca3af" font-family="Arial,sans-serif" font-size="15">Case review</text>
  <text x="90" y="334" fill="#9ca3af" font-family="Arial,sans-serif" font-size="15">Monitoring</text>
  <text x="292" y="100" fill="#f9fafb" font-family="Arial,sans-serif" font-size="29" font-weight="700">Compliance overview</text>
  <text x="292" y="130" fill="#9ca3af" font-family="Arial,sans-serif" font-size="16">Illustrative risk screening dashboard</text>
  <g font-family="Arial,sans-serif">
    <rect x="292" y="160" width="245" height="102" rx="15" fill="#1f2937" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="316" y="195" fill="#9ca3af" font-size="15">Screenings today</text>
    <text x="316" y="237" fill="#fff" font-size="31" font-weight="700">1,284</text>
    <rect x="555" y="160" width="245" height="102" rx="15" fill="#1f2937" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="579" y="195" fill="#9ca3af" font-size="15">Requires review</text>
    <text x="579" y="237" fill="#fbbf24" font-size="31" font-weight="700">18</text>
    <rect x="818" y="160" width="300" height="102" rx="15" fill="#1f2937" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="842" y="195" fill="#9ca3af" font-size="15">Risk level</text>
    <text x="842" y="237" fill="#fb7185" font-size="27" font-weight="700">Elevated alerts</text>
  </g>
  <rect x="292" y="285" width="505" height="230" rx="15" fill="#1f2937" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="320" y="324" fill="#f9fafb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Risk activity</text>
  <path d="M330 465 L390 435 L450 449 L510 386 L570 405 L630 350 L690 372 L755 335" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 485H760M330 430H760M330 375H760" fill="none" stroke="#94a3b8" stroke-opacity=".14"/>
  <rect x="817" y="285" width="301" height="230" rx="15" fill="#1f2937" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="845" y="324" fill="#f9fafb" font-family="Arial,sans-serif" font-size="18" font-weight="700">Screening checks</text>
  <g font-family="Arial,sans-serif" font-size="15">
    <circle cx="856" cy="370" r="7" fill="#34d399"/><text x="875" y="376" fill="#d1d5db">Sanctions screening</text>
    <circle cx="856" cy="410" r="7" fill="#34d399"/><text x="875" y="416" fill="#d1d5db">PEP checks</text>
    <circle cx="856" cy="450" r="7" fill="#fbbf24"/><text x="875" y="456" fill="#d1d5db">Adverse media</text>
    <circle cx="856" cy="490" r="7" fill="#60a5fa"/><text x="875" y="496" fill="#d1d5db">Ongoing monitoring</text>
  </g>
</svg>
